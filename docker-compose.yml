# Easiest: run the launcher, which asks the setup questions and then starts ML Sentry:
#   Windows:      .\mlsentry.cmd          macOS/Linux:  ./mlsentry.sh
# By hand:
#   docker compose run --rm --build mlsentry mlsentry    setup questions / settings menu
#   docker compose up -d --build                 start watching in the background
#   docker compose logs -f                       watch its output
services:
  mlsentry:
    build: .
    container_name: mlsentry
    environment:
      # Inside the container "localhost" is the container itself,
      # so MLflow and Ollama are reached on your computer through host.docker.internal
      MLFLOW_TRACKING_URI: ${DOCKER_MLFLOW_TRACKING_URI:-http://host.docker.internal:5000}
      OLLAMA_HOST: ${DOCKER_OLLAMA_HOST:-http://host.docker.internal:11434}
      SQLITE_PATH: /app/state/mlsentry.db
    volumes:
      # Your settings: the setup questions write this file, ML Sentry reads it at start
      - ${MLSENTRY_ENV_FILE:-./.env}:/app/.env
      - ./state:/app/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
